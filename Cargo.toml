[workspace]
resolver = "3"
members = ["crates/guidance", "crates/model", "crates/sim", "crates/socp", "crates/wasm"]

# Tests run many solves; the solver is generic code compiled inside our crate,
# so optimise the test profile itself. Plain `cargo build` stays debuggable.
[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Moazzam Ali"]
repository = "https://github.com/moazzamaliakamonad-byte/KESTREL"
homepage = "https://moazzamaliakamonad-byte.github.io/KESTREL/"
keywords = ["rocket", "guidance", "convex-optimization", "aerospace", "simulation"]
categories = ["aerospace::simulation", "science", "mathematics", "simulation", "wasm"]
