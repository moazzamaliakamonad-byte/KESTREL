# Checks on every push and pull request; on main, also publishes the page
# to GitHub Pages (a static export: everything runs in the browser).
# The slow tests (#[ignore], Playwright end-to-end) stay opt-in and do not
# run here (docs/SETUP.md, test policy).

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (format, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Failing tests are also published as annotations, so their names
      # and messages show on the run's summary page without the full log.
      - name: cargo test --workspace
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test.log || {
            grep -E '^test .* FAILED$' test.log | sed -E 's/^test (.*) \.\.\. FAILED$/::error title=Test failed::\1/'
            grep -E "panicked at|^  left:|^ right:|assertion" test.log | head -n 30 | sed -E 's/^/::error title=Test output::/'
            exit 1
          }

  web:
    name: Web (WASM build, lint, types, unit tests, site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Must match the wasm-bindgen library version in crates/wasm (D-007).
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run wasm
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      # Served from https://<owner>.github.io/<repository>/, so every URL
      # gets the repository name as its base path.
      - name: Build the site
        run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/out

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
