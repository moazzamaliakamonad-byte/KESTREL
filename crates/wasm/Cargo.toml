[package]
name = "kestrel-wasm"
version = "0.1.0"
description = "WebAssembly bridge for Kestrel guidance: JSON in, JSON out"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
guidance = { path = "../guidance", package = "kestrel-guidance" }
sim = { path = "../sim", package = "kestrel-sim" }
model = { path = "../model", package = "kestrel-model" }
wasm-bindgen = "=0.2.130"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Benchmarks and tests may compare against the reference solver; the page
# build never includes it.
guidance = { path = "../guidance", package = "kestrel-guidance", features = ["reference-solver"] }
