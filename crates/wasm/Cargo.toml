[package]
name = "kestrel-wasm"
version = "0.1.0"
description = "WebAssembly bridge for Kestrel guidance: JSON in, JSON out"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
guidance = { path = "../guidance", package = "kestrel-guidance" }
sim = { path = "../sim", package = "kestrel-sim" }
wasm-bindgen = "=0.2.130"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
